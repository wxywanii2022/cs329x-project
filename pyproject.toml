[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-tutor-simulator"
version = "0.1.0"
description = "Auditable, paired four-condition experiments for the CS329X adaptive tutor project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tutor-sim = "adaptive_tutor.cli:main"
tutor-assess = "adaptive_tutor.rq1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_tutor = ["data/*.json", "prompts/*.txt", "rq1/rubrics/*.md"]
